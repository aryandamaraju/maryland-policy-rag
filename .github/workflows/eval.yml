name: retrieval-eval
on: [push, pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastembed==0.9.0 numpy python-dotenv
      - run: python eval.py hybrid
        env:
          EVAL_RETRIEVAL_ONLY: "1"
          MIN_HIT_RATE: "0.9"
          RETRIEVAL_MODE: hybrid
